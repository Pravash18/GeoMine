[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geomine"
version = "1.0.0"
description = "Mineral hotspot prediction REST API"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4.0"]

[tool.unittest]
# Tests are runnable with: python -m unittest discover -s tests -v
